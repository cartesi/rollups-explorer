name: Docker
on:
    push:
        tags:
            - "v*"
    pull_request:
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
permissions:
    contents: read
    packages: write
    id-token: write
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

            - name: Docker meta
              id: docker_meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
              with:
                  images: |
                      name=ghcr.io/cartesi/rollups-explorer
                      name=docker.io/cartesi/rollups-explorer,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=ref,event=branch
                      type=ref,event=pr

            - name: Login to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
              if: ${{ startsWith(github.ref, 'refs/tags/v') }}
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c #v1.7.2

            - name: Build and push docker image
              id: docker_build
              uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 #v1.13.0
              with:
                  files: |
                      ./docker-bake.hcl
                      ${{ steps.docker_meta.outputs.bake-file }}
                      ./docker-bake.platforms.hcl
                  push: true
                  project: ${{ vars.DEPOT_PROJECT }}
